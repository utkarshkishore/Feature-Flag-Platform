name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: featureflag
          POSTGRES_PASSWORD: featureflag
          POSTGRES_DB: featureflag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U featureflag" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://featureflag:featureflag@localhost:5432/featureflag
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_jwt_secret
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm --workspace apps/backend run prisma:dev
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Build docker images
        run: |
          docker build -t featureflag-backend ./apps/backend
          docker build -t featureflag-frontend ./apps/frontend
