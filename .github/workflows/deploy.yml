name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init
      - name: Terraform apply (ECR)
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve -target aws_ecr_repository.frontend -target aws_ecr_repository.backend
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          FRONTEND_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/feature-flag-frontend:${GITHUB_SHA}"
          BACKEND_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/feature-flag-backend:${GITHUB_SHA}"
          docker build -t $FRONTEND_IMAGE ./apps/frontend
          docker build -t $BACKEND_IMAGE ./apps/backend
          docker push $FRONTEND_IMAGE
          docker push $BACKEND_IMAGE
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> $GITHUB_ENV
      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "frontend_image=$FRONTEND_IMAGE" \
            -var "backend_image=$BACKEND_IMAGE" \
            -var "acm_certificate_arn=${{ secrets.ACM_CERT_ARN }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var "jwt_refresh_secret=${{ secrets.JWT_REFRESH_SECRET }}"
      - name: Smoke test
        run: |
          ALB_DNS=$(terraform -chdir=infra/terraform output -raw alb_dns_name)
          curl -f "https://${ALB_DNS}/health"
